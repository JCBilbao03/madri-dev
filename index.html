<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>MadriBuild — Building High-Performance Web Applications</title>
    <meta
      name="description"
      content="MadriBuild is a web application development agency. We design and ship custom web apps, SaaS products, and performance work that moves business metrics."
    />
    <meta name="theme-color" content="#0A0A0B" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MadriBuild — Building High-Performance Web Applications" />
    <meta
      property="og:description"
      content="We design and ship custom web apps, SaaS products, and performance work that moves business metrics."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint. Mirrors readStoredTheme() in src/lib/theme.ts.
      (function () {
        try {
          var themeKey = 'madribuild-theme';
          var legacyKey = 'madridev-theme';
          var stored = localStorage.getItem(themeKey) || localStorage.getItem(legacyKey);
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
        } catch (e) {
          /* localStorage unavailable — keep the default dark class */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
